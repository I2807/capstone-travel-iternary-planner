services:
  - type: web
    name: voyager-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: MODEL_NAME
        value: gemma-4-26b-a4b-it
      - key: FALLBACK_MODEL_NAME
        value: gemini-3.6-flash
      - key: WEATHER_PROVIDER
        value: mock
      - key: MOCK_WEATHER_SCENARIO
        value: rain
      - key: CORS_ORIGINS
        value: https://i2807.github.io
      - key: API_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_CONVERSATION_MESSAGES
        value: "50"
      - key: LOG_LEVEL
        value: INFO
